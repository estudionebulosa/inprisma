name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Content gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate 0: the generated artifacts must be reproducible from the contract.
      - name: Generate schema from the contract
        run: npm run generate

      # Gate 1: schema validation. Gate 2: PRD content rules.
      - name: Validate contract and content
        run: npm run validate

      - name: Build
        run: npm run build

      # Gate 3: JSON-LD parses and required nodes/fields are present.
      - name: Verify JSON-LD
        run: npm run verify:jsonld

      # Gate 6: internal links resolve; external links are format-checked.
      - name: Check links
        run: npm run linkcheck

      # Gate 4 (part): critical HTML under 10kb, no browser needed.
      - name: Check critical HTML size
        run: npm run check:html-size

      # Gate 4 (LCP/CLS) + Gate 5 (axe-core accessibility) via Lighthouse.
      # Lighthouse uses axe-core for its accessibility category.
      - uses: browser-actions/setup-chrome@v1

      - name: Run Lighthouse (performance + accessibility)
        run: npm run check:lighthouse

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: .lighthouseci/
          if-no-files-found: ignore
